name: Validate and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest-homeassistant-custom-component

      - name: Validate JSON and Python
        run: |
          python -m json.tool custom_components/korfbal_schedule/manifest.json >/dev/null
          python -m json.tool custom_components/korfbal_schedule/strings.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          python -m compileall -q custom_components/korfbal_schedule tests

      - name: Read manifest version
        id: metadata
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/korfbal_schedule/manifest.json"))["version"])')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate tag and manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${VERSION}"
          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match manifest version ${VERSION} (expected ${EXPECTED_TAG})." >&2
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          awk -v target="v${VERSION}" '
            $1 == "##" && ($2 == target || $2 == "[" substr(target, 2) "]") { in_section=1 }
            in_section && $1 == "##" && $2 != target && $2 != "[" substr(target, 2) "]" { exit }
            in_section { print }
          ' CHANGES.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No release-notes section found for v${VERSION}." >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.RELEASE_TAG;
            const body = fs.readFileSync("release-notes.md", "utf8").trim();
            const name = tag;
            const repository = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                ...repository,
                tag,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (release) {
              await github.rest.repos.updateRelease({
                ...repository,
                release_id: release.data.id,
                name,
                body,
                draft: false,
                prerelease: false,
              });
            } else {
              await github.rest.repos.createRelease({
                ...repository,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                body,
                draft: false,
                prerelease: false,
              });
            }